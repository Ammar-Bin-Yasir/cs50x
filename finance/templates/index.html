
{% extends "layout.html" %}

{% block title %}
    Home
{% endblock %}

{% block main %}
<table class="table table-striped">
    <thead>
        <tr>
            <th class="text-start">Symbol</th>
            <th class="text-end">Shares</th>
            <th class="text-end">Price</th>
            <th class="text-end">TOTAL</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td class="border-0 fw-bold text-end">{{ row.stock }}</td>
            <td class="border-0 fw-bold text-end">{{ row.shares }}</td>
            <td class="border-0 fw-bold text-end">{{ row.price | usd }}</td>
            <td class="border-0 fw-bold text-end">{{ row.total | usd }}</td>
        </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <td class="border-0 fw-bold text-end" colspan="3">Cash</td>
            <td class="border-0 text-end">{{ cash | usd }}</td>
        </tr>
        <tr>
            <td class="border-0 fw-bold text-end" colspan="3">TOTAL</td>
            <td class="border-0 w-bold text-end">{{ total_assets | usd }}</td>
        </tr>
    </tfoot>
</table>
{% endblock %}
